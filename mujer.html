<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Americanoshh - Mujer</title>
  
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <!-- Barra de navegación -->
  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="acerca de.html"><img src="assets/logo.png" alt="Logo Americanoshh"></a>
      </div>
      <ul class="nav-links">
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="hombre.html">Hombre</a></li>
        <li><a href="mujer.html" class="fw-bold text-info">Mujer</a></li>
        <li><a href="unisex.html">Unisex</a></li>
        <li><a href="colecciones.html">Colecciones</a></li>
        <li><a href="acerca de.html">Acerca de</a></li>
        <li><a href="perfil.html">Perfil</a></li>
      </ul>
      <div class="search-bar">
        <input type="text" placeholder="Buscar productos...">
        <select id="priceFilter">
          <option value="all">Todos los precios</option>
          <option value="50000">Hasta $50.000</option>
          <option value="60000">Hasta $60.000</option>
        </select>
        <button type="button">🔍</button>
      </div>

      <!-- Menú de Usuario Dinámico -->
      <div id="userMenuNav" class="d-flex align-items-center ms-3"></div>
    </nav>
  </header>

  <!-- Catálogo Mujer Dinámico -->
  <main class="catalog">
    <h2>Colección Mujer</h2>

    <div id="contenedorProductosMujer" class="catalog-grid">
      <div class="text-center w-100 py-4 text-muted">Cargando productos del catálogo...</div>
    </div>
  </main>

  <!-- Modal Detalles del producto -->
  <div id="product-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <div class="modal-body">
        <div class="modal-left">
          <div class="image-container">
            <img id="modal-img" src="" alt="Producto">
          </div>
        </div>
        <div class="modal-right">
          <h1 id="modal-title" class="urban-title"></h1>
          <p class="modal-stock">En stock</p>
          <p id="modal-price" class="modal-price"></p>
          <div class="modal-sizes">
            <h3 class="urban-subtitle">Tallas</h3>
            <div class="sizes-grid">
              <button type="button" class="size-btn">XS</button>
              <button type="button" class="size-btn">S</button>
              <button type="button" class="size-btn">M</button>
              <button type="button" class="size-btn">L</button>
              <button type="button" class="size-btn">XL</button>
            </div>
          </div>
          <button type="button" class="btn-buy">
            <span><a href="https://wa.me/573124363561" target="_blank" rel="noopener noreferrer">Compra Ahora</a></span>
          </button>
          <p id="modal-desc" class="modal-desc"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
