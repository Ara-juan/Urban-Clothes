<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Americanoshh</title>

  <!-- Bootstrap CSS 5.3.8 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <!-- Barra de navegación -->
  <header class="w-100 position-fixed top-0 start-0 z-3">
    <nav class="navbar">
      <div class="logo">
        <a href="acerca de.html"><img src="assets/logo.png" alt="Logo Americanoshh"></a>
      </div>
      <ul class="nav-links">
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="hombre.html">Hombre</a></li>
        <li><a href="mujer.html">Mujer</a></li>
        <li><a href="unisex.html">Unisex</a></li>
        <li><a href="main.html">Colecciones</a></li>
        <li><a href="acerca de.html">Acerca de</a></li>
        <li><a href="perfil.html" class="active">Perfil</a></li>
      </ul>
      <div id="userMenuNav" class="d-flex align-items-center ms-3"></div>
    </nav>
  </header>

  <!-- Contenedor del Formulario de Perfil -->
  <main class="login-container mt-5 pt-5">
    <div class="form-box">
      <h2>Mi Perfil</h2>
      <p class="text-secondary small mb-3">Actualiza tus datos y contraseña de acceso</p>

      <form id="perfilForm" onsubmit="actualizarPerfil(event)">
        <!-- Información básica (Sólo Lectura) -->
        <div class="mb-2 text-start">
          <label class="form-label text-white-50 small mb-0">Nombre Completo</label>
          <input type="text" id="perfilNombre" readonly class="form-control bg-dark text-white border-secondary">
        </div>

        <div class="mb-3 text-start">
          <label class="form-label text-white-50 small mb-0">Correo Electrónico</label>
          <input type="email" id="perfilEmail" readonly class="form-control bg-dark text-white border-secondary">
        </div>

        <hr class="border-secondary my-3">

        <!-- Datos Opcionales -->
        <h3 class="h6 text-info text-start">Datos de Envío (Opcionales)</h3>
        
        <div class="mb-2 text-start">
          <label for="perfilTelefono" class="form-label small mb-0">Teléfono</label>
          <input type="tel" id="perfilTelefono" placeholder="Ingresa tu teléfono (Opcional)" pattern="^[0-9]*$">
        </div>

        <div class="mb-3 text-start">
          <label for="perfilDireccion" class="form-label small mb-0">Dirección</label>
          <input type="text" id="perfilDireccion" placeholder="Ingresa tu dirección (Opcional)">
        </div>

        <hr class="border-secondary my-3">

        <!-- Cambio de Contraseña -->
        <h3 class="h6 text-info text-start">Cambiar Contraseña</h3>

        <div class="mb-2 text-start">
          <label for="contrasenaActual" class="form-label small mb-0">Contraseña Actual</label>
          <input type="password" id="contrasenaActual" placeholder="Requerida solo si vas a cambiarla" minlength="8">
        </div>

        <div class="mb-3 text-start">
          <label for="nuevaContrasena" class="form-label small mb-0">Nueva Contraseña</label>
          <input type="password" id="nuevaContrasena" placeholder="Mínimo 8 caracteres" minlength="8">
        </div>

        <button type="submit" class="btn w-100 mt-3">Guardar Cambios</button>
      </form>

      <!-- Mensajes dinámicos -->
      <div id="mensajePerfil" class="mt-3 text-center fw-bold" style="display: none;"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth.js"></script>
  <script src="perfil.js"></script>
</body>
</html>
