<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Americanoshh</title>

  <!-- Bootstrap CSS 5.3.8 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

  <!-- Estilo Exclusivo de Perfil -->
  <link rel="stylesheet" href="perfil.css">
</head>
<body>

  <!-- Barra de navegación -->
  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="acerca de.html"><img src="assets/logo.png" alt="Logo Americanoshh"></a>
      </div>
      <ul class="nav-links">
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="hombre.html">Hombre</a></li>
        <li><a href="mujer.html">Mujer</a></li>
        <li><a href="unisex.html">Unisex</a></li>
        <li><a href="colecciones.html">Colecciones</a></li>
        <li><a href="acerca de.html">Acerca de</a></li>
        <li><a href="perfil.html" class="active">Perfil</a></li>
      </ul>
      <div id="userMenuNav" class="d-flex align-items-center ms-3"></div>
    </nav>
  </header>

  <!-- Formulario de Perfil -->
  <main class="profile-wrapper">
    <div class="profile-card">
      <h2 class="text-center">Mi Perfil</h2>
      <p class="text-center subtitle">Gestiona tu información personal y de seguridad</p>

      <form id="perfilForm" onsubmit="actualizarPerfil(event)">
        <!-- Información básica -->
        <div class="mb-3 text-start">
          <label class="form-label">Nombre Completo</label>
          <input type="text" id="perfilNombre" readonly class="form-control">
        </div>

        <div class="mb-3 text-start">
          <label class="form-label">Correo Electrónico</label>
          <input type="email" id="perfilEmail" readonly class="form-control">
        </div>

        <hr class="profile-divider">

        <!-- Datos Opcionales -->
        <h3 class="section-title text-start">Datos de Envío (Opcionales)</h3>
        
        <div class="mb-3 text-start">
          <label for="perfilTelefono" class="form-label">Teléfono</label>
          <input type="tel" id="perfilTelefono" class="form-control" placeholder="Ingresa tu teléfono (Opcional)" pattern="^[0-9]*$">
        </div>

        <div class="mb-3 text-start">
          <label for="perfilDireccion" class="form-label">Dirección</label>
          <input type="text" id="perfilDireccion" class="form-control" placeholder="Ingresa tu dirección (Opcional)">
        </div>

        <hr class="profile-divider">

        <!-- Cambio de Contraseña -->
        <h3 class="section-title text-start">Cambiar Contraseña</h3>

        <div class="mb-3 text-start">
          <label for="contrasenaActual" class="form-label">Contraseña Actual</label>
          <input type="password" id="contrasenaActual" class="form-control" placeholder="Requerida solo si vas a cambiarla" minlength="8">
        </div>

        <div class="mb-3 text-start">
          <label for="nuevaContrasena" class="form-label">Nueva Contraseña</label>
          <input type="password" id="nuevaContrasena" class="form-control" placeholder="Mínimo 8 caracteres" minlength="8">
        </div>

        <button type="submit" class="btn-save mt-3">Guardar Cambios</button>
      </form>

      <!-- Mensajes dinámicos -->
      <div id="mensajePerfil" class="mt-3 text-center fw-bold" style="display: none;"></div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth.js"></script>
  <script src="perfil.js"></script>
</body>
</html>
